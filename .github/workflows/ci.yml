# Runs on every pull request. A pull request can only be merged when the
# "checks" job passes (set in the repo's branch rules).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      # The server functions run on Deno, not Node, so Deno checks them.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check server functions
        run: deno check supabase/functions/*/index.ts
      - name: Tests
        run: npm test
      - name: Build
        run: npx vite build
